name: Java CI Pipeline for WebApp

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compile
        run: javac WebApp.java

      - name: Run
        run: |
          nohup java WebApp &
          sleep 5
          curl -I http://localhost:8080 || echo "Server running check complete"
